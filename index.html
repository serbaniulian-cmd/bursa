<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bursa">
<meta name="theme-color" content="#070a1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="bursa.webmanifest">
<link rel="apple-touch-icon" href="bursa-192.png">
<title>Bursa</title>
<style>
:root{color-scheme:light dark;--bg:#f3f2fb;--card:#fff;--ink:#17152b;--mute:#8280a0;--line:#ecebf6;--gain:#0f9d76;--loss:#e5384f;--fill:#efeefa;--g1:#5b4bff;--g2:#8b4dff;--g3:#ff5fa2}
@media (prefers-color-scheme:dark){:root{--bg:#0f0e17;--card:#1a1926;--ink:#f4f3ff;--mute:#8d8ba7;--line:#2a2940;--gain:#3fd7a8;--loss:#ff7389;--fill:#232235}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded","Avenir Next","Segoe UI",system-ui,sans-serif;max-width:560px;margin:0 auto;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
header{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 8px}
.hero{background:linear-gradient(135deg,var(--g1) 0%,var(--g2) 55%,var(--g3) 130%);color:#fff;border-radius:28px;padding:24px 22px 20px;box-shadow:0 10px 30px rgba(91,75,255,.28)}
.hero .lbl{font-size:13px;opacity:.8}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-1px;line-height:1.1;margin:6px 0 16px;font-variant-numeric:tabular-nums}
.hero .row{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;font-variant-numeric:tabular-nums}
.hero .row span{background:rgba(255,255,255,.18);padding:5px 11px;border-radius:99px}
.hero .pos{color:#b8ffe3}.hero .neg{color:#ffd0d6}
.pos{color:var(--gain)}.neg{color:var(--loss)}
nav{display:flex;gap:4px;margin:10px 16px;padding:4px;background:var(--card);border-radius:99px;position:sticky;top:8px;z-index:5;box-shadow:0 2px 10px rgba(60,50,140,.08)}
nav button{flex:1;border:0;background:none;padding:10px 4px;border-radius:99px;font:inherit;font-size:14px;font-weight:600;color:var(--mute);cursor:pointer}
nav button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
main{padding:0 16px}
.card{background:var(--card);border-radius:22px;padding:16px;margin:12px 0}
.card:has(.tr){padding:4px 16px}
.alloc{display:flex;align-items:center;gap:18px;background:var(--card);border-radius:22px;padding:18px;margin:12px 0}
.alloc svg{width:132px;height:132px;flex:none}
.dn{font-size:26px;font-weight:700;fill:var(--ink)}.dl{font-size:9px;fill:var(--mute)}
.legend{flex:1;display:grid;gap:8px;min-width:0}
.lg{display:flex;align-items:center;gap:8px;font-size:14px}
.lg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg b{font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:8px;flex:none}
.lg .dot{margin:0}
.pr{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
.av{width:48px;height:48px;border-radius:16px;color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.sym{font-size:17px;font-weight:700}
.sub{color:var(--mute);font-size:13px}
.v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.v .sub{font-weight:600}
.v .sub.pos{color:var(--gain)}.v .sub.neg{color:var(--loss)}
.px{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--mute)}
.px input{width:130px;margin-left:auto;text-align:right}
input,select{font:inherit;padding:11px 14px;border:0;border-radius:14px;background:var(--fill);color:var(--ink);width:100%}
.month{display:flex;justify-content:space-between;margin:22px 6px 0;font-size:13px;font-weight:600;color:var(--mute)}
.tr{display:grid;grid-template-columns:26px 1fr auto 24px;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
.day{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:700;margin-left:8px;padding:2px 8px;border-radius:99px;background:var(--fill);color:var(--mute)}
.tag.B{background:rgba(15,157,118,.14);color:var(--gain)}.tag.V{background:rgba(229,56,79,.14);color:var(--loss)}
.del{border:0;background:none;color:var(--mute);font-size:20px;padding:0;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:64px 12px;font-size:15px}
#add{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:22px;border:0;background:linear-gradient(135deg,var(--g1),var(--g3));color:#fff;font-size:30px;cursor:pointer;box-shadow:0 8px 20px rgba(139,77,255,.4)}
dialog{border:0;border-radius:28px;padding:24px;width:min(440px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(15,14,23,.5)}
dialog h2{margin:0 0 16px;font-size:20px}
.seg{display:flex;gap:4px;margin-bottom:16px;background:var(--fill);padding:4px;border-radius:99px}
.seg button{flex:1;padding:9px 4px;border:0;background:none;border-radius:99px;font:inherit;font-size:14px;font-weight:600;color:var(--mute);cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.f{margin-bottom:12px}.f label{display:block;font-size:12px;color:var(--mute);margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:10px;margin-top:20px}
.acts button{flex:1;padding:14px;border-radius:16px;border:0;font:inherit;font-weight:700;cursor:pointer}
.ok{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}.no{background:var(--fill);color:var(--ink)}
#st{text-align:center;color:var(--mute);font-size:12px;margin-top:28px;padding:0 24px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--g2);outline-offset:2px}
.lnk{border:0;background:none;color:var(--g2);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:8px}

/* animații */
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.95)}}
@keyframes fade{from{opacity:0}}
@keyframes flow{from{background-position:0% 40%}to{background-position:100% 60%}}
@keyframes float{to{transform:translate(-26px,30px) scale(1.2)}}
@keyframes draw{from{stroke-dasharray:0 var(--C)}}
@keyframes bump{0%{transform:scale(.4) rotate(-90deg);opacity:0}70%{transform:scale(1.1) rotate(8deg)}}
.hero{position:relative;overflow:hidden;background-size:200% 200%;animation:flow 14s ease-in-out infinite alternate}
.hero>*{position:relative;z-index:1}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.16);filter:blur(10px);animation:float 8s ease-in-out infinite alternate}
.hero .row span{animation:rise .6s .25s cubic-bezier(.2,.7,.2,1) both}
.hero .row span:nth-child(2){animation-delay:.33s}.hero .row span:nth-child(3){animation-delay:.41s}.hero .row span:nth-child(4){animation-delay:.49s}
.anim>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.anim>*:nth-child(1){animation-delay:0.05s}.anim>*:nth-child(2){animation-delay:0.10s}.anim>*:nth-child(3){animation-delay:0.15s}.anim>*:nth-child(4){animation-delay:0.20s}.anim>*:nth-child(5){animation-delay:0.25s}.anim>*:nth-child(6){animation-delay:0.30s}.anim>*:nth-child(7){animation-delay:0.35s}.anim>*:nth-child(8){animation-delay:0.40s}.anim>*:nth-child(9){animation-delay:0.45s}.anim>*:nth-child(10){animation-delay:0.50s}.anim>*:nth-child(11){animation-delay:0.55s}.anim>*:nth-child(12){animation-delay:0.60s}
.anim .arc{animation:draw 1.1s cubic-bezier(.3,.7,.2,1) both;animation-delay:calc(var(--i)*.09s + .1s)}
.anim .lg{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*.06s + .35s)}
.card,.alloc{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s}
@media (hover:hover){.card:not(:has(.tr)):hover,.alloc:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(60,50,140,.13)}}
button{transition:transform .15s,opacity .15s,background .2s}
button:active{transform:scale(.94)}
#add{animation:bump .6s .3s cubic-bezier(.3,1.4,.4,1) both;transition:transform .2s}
#add:hover{transform:rotate(90deg) scale(1.06)}
#add:active{transform:scale(.9)}
nav{position:sticky}
#pill{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:99px;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 4px 12px rgba(91,75,255,.35)}
#pill.ready{transition:transform .38s cubic-bezier(.3,.8,.3,1),width .38s cubic-bezier(.3,.8,.3,1)}
nav button{position:relative;z-index:1}
nav button.on{background:none;color:#fff}
.tr{transition:opacity .25s,transform .25s}
.tr.out{opacity:0;transform:translateX(36px)}
.seg button.on{animation:fade .25s}
dialog[open]{animation:pop .32s cubic-bezier(.2,.9,.3,1.15)}
dialog[open]::backdrop{animation:fade .3s}
input,select{transition:box-shadow .2s,background .2s}
input:focus{box-shadow:0 0 0 2px var(--g2)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* animații v2 */
[hidden]{display:none!important}
@keyframes slideR{from{opacity:0;transform:translateX(38px)}}
@keyframes slideL{from{opacity:0;transform:translateX(-38px)}}
@keyframes grow{from{width:0}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes ripple{to{transform:scale(1);opacity:0}}
@keyframes pulse{0%{box-shadow:0 8px 20px rgba(139,77,255,.4),0 0 0 0 rgba(255,95,162,.55)}70%,100%{box-shadow:0 8px 20px rgba(139,77,255,.4),0 0 0 20px rgba(255,95,162,0)}}
@keyframes glowUp{40%{text-shadow:0 0 24px #7dffcb}}
@keyframes glowDown{40%{text-shadow:0 0 24px #ff8da0}}
@keyframes okf{30%{box-shadow:0 0 0 3px var(--gain);background:rgba(15,157,118,.18)}}
.hero{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));transition:transform .25s ease-out,opacity .2s;will-change:transform}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,75%) var(--my,0%),rgba(255,255,255,.3),transparent 55%);pointer-events:none}
.big.up{animation:glowUp 1.1s}.big.down{animation:glowDown 1.1s}
.anim[data-dir="1"]>*{animation-name:slideR}
.anim[data-dir="-1"]>*{animation-name:slideL}
.bar{height:6px;border-radius:99px;background:var(--fill);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.anim .bar i{animation:grow 1s cubic-bezier(.3,.7,.2,1) both;animation-delay:.3s}
.arc,.lg{cursor:pointer}
.arc{transition:opacity .3s,stroke-width .3s}
.lg{transition:opacity .3s,transform .3s}
.alloc.sel .arc{opacity:.22}.alloc.sel .arc.on{opacity:1;stroke-width:21}
.alloc.sel .lg{opacity:.4}.alloc.sel .lg.on{opacity:1;transform:translateX(5px)}
.alloc.sel .dn{font-size:20px}
.dn{transition:font-size .2s}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
button{position:relative;overflow:hidden}
#add{animation:bump .6s .3s cubic-bezier(.3,1.4,.4,1) both,pulse 2.6s 1.3s infinite}
nav.stuck{box-shadow:0 10px 28px rgba(60,50,140,.2)}
nav{transition:box-shadow .3s}
.okf{animation:okf 1s}
.sk{height:96px;border-radius:22px;margin:12px 0;background:linear-gradient(90deg,var(--card) 25%,var(--fill) 50%,var(--card) 75%);background-size:200% 100%;animation:shim 1.3s infinite linear}
dialog[open]>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
dialog[open]>*:nth-child(1){animation-delay:0.09s}dialog[open]>*:nth-child(2){animation-delay:0.13s}dialog[open]>*:nth-child(3){animation-delay:0.17s}dialog[open]>*:nth-child(4){animation-delay:0.21s}dialog[open]>*:nth-child(5){animation-delay:0.25s}dialog[open]>*:nth-child(6){animation-delay:0.29s}dialog[open]>*:nth-child(7){animation-delay:0.33s}dialog[open]>*:nth-child(8){animation-delay:0.37s}

/* prețuri live + asistent */
@keyframes blink{50%{opacity:.25}}
.live{margin-top:14px;background:none;border:0;color:#fff;opacity:.9;font:inherit;font-size:12px;padding:0;display:flex;align-items:center;gap:7px;cursor:pointer;text-align:left}
.live::before{content:"";flex:none;width:8px;height:8px;border-radius:4px;background:#7dffcb;animation:blink 1.6s infinite}
.live.off::before{background:#ffd0d6;animation:none}
#askb{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:22px;border:0;background:var(--card);color:var(--ink);font-size:26px;box-shadow:0 8px 20px rgba(60,50,140,.22);cursor:pointer;animation:bump .6s .4s cubic-bezier(.3,1.4,.4,1) both}
#log{max-height:42vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:12px 0}
.b{max-width:88%;padding:10px 14px;border-radius:18px;font-size:14px;white-space:pre-wrap;animation:rise .35s both}
.b.me{align-self:flex-end;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-bottom-right-radius:6px}
.b.ai{align-self:flex-start;background:var(--fill);border-bottom-left-radius:6px}
#log .lnk{align-self:flex-start;padding:2px 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border:0;background:var(--fill);color:var(--ink);border-radius:99px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.send{display:flex;gap:8px}
.send button{flex:none;width:52px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-size:20px;cursor:pointer}
.card.hit{box-shadow:0 0 0 2px var(--gain),0 12px 28px rgba(15,157,118,.22)}
.card.hit .tag{animation:blink 1.4s infinite}

/* evoluție + simulator */
@keyframes dash{from{stroke-dashoffset:1}}
@keyframes sy{from{transform:scaleY(0)}}
nav button{font-size:13px;padding:10px 2px}
.ln{stroke-dasharray:1}
.anim .ln{animation:dash 1.5s cubic-bezier(.3,.7,.2,1) .15s both}
.anim .fadeln{animation:fade 1s .7s both}
.br{transform-box:fill-box;transform-origin:bottom}
.anim .br{animation:sy .7s cubic-bezier(.3,.7,.2,1) both;animation-delay:calc(var(--i)*.025s)}
svg.ch{width:100%;height:auto;display:block;touch-action:pan-y;cursor:crosshair}
.ax{font-size:9px;fill:var(--mute)}
.ro{font-size:13px;margin:6px 2px 10px;min-height:40px;line-height:1.35}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stats .t{background:var(--card);border-radius:18px;padding:12px 10px}
.stats .t>span{display:block;font-size:11px;color:var(--mute);margin-bottom:2px}
.stats .t b{font-size:14px;font-variant-numeric:tabular-nums}
.lgd{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute)}
.lgd i{display:inline-block;width:9px;height:9px;border-radius:5px;margin-right:5px}
input[type=range]{padding:0;background:none;accent-color:var(--g2);height:28px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:4px}
.chk input{width:auto}

/* buton asistent custom */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{50%{transform:scale(.8) rotate(14deg);opacity:.85}}
@keyframes aipulse{0%,100%{box-shadow:0 10px 28px rgba(91,75,255,.28),0 0 0 1px var(--line),0 0 0 0 rgba(139,77,255,.35)}60%{box-shadow:0 10px 28px rgba(91,75,255,.28),0 0 0 1px var(--line),0 0 0 14px rgba(139,77,255,0)}}
@keyframes dotb{50%{transform:translateY(-4px);opacity:.45}}
#askb{width:auto;height:58px;padding:0 22px 0 7px;border-radius:29px;display:flex;align-items:center;gap:10px;font:inherit;font-size:14px;font-weight:700;box-shadow:0 10px 28px rgba(91,75,255,.28),0 0 0 1px var(--line);animation:bump .6s .4s cubic-bezier(.3,1.4,.4,1) both,aipulse 3.2s 1.5s infinite;transition:padding .4s cubic-bezier(.3,.8,.3,1),transform .2s}
#askb .lbl{max-width:110px;white-space:nowrap;overflow:hidden;transition:max-width .4s cubic-bezier(.3,.8,.3,1),opacity .3s,margin .4s}
#askb.compact{padding-right:7px}
#askb.compact .lbl{max-width:0;opacity:0;margin-left:-10px}
#askb.compact:hover,#askb.compact:focus-visible{padding-right:22px}
#askb.compact:hover .lbl,#askb.compact:focus-visible .lbl{max-width:110px;opacity:1;margin-left:0}
#askb:hover{transform:translateY(-2px)}
.orb{position:relative;flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#c9bcff,var(--g1) 55%,var(--g2));box-shadow:0 4px 14px rgba(91,75,255,.5),inset 0 0 0 1px rgba(255,255,255,.28)}
.orb::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(from 0deg,var(--g1),var(--g3),#6fe0ff,var(--g1));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));animation:spin 4s linear infinite}
.orb svg{width:22px;height:22px;fill:#fff;animation:twinkle 2.8s ease-in-out infinite}
.orb.sm{width:38px;height:38px}.orb.sm svg{width:19px;height:19px}
.aihead{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.aihead h2{margin:0}
#ai{background:radial-gradient(circle at 100% 0,rgba(139,77,255,.2),transparent 55%),var(--card)}
.b.typing{display:flex;gap:5px;padding:14px 16px}
.b.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:dotb 1s infinite}
.b.typing i:nth-child(2){animation-delay:.15s}.b.typing i:nth-child(3){animation-delay:.3s}
.send input{border-radius:99px;padding-left:18px}
.send button{width:48px;height:48px;border-radius:50%;font-size:22px;font-weight:700}
.chips button{background:var(--fill);border:1px solid var(--line)}

/* bara Meniscus */
#tabs{display:flex;position:sticky;top:0;height:88px;margin:6px 16px 4px;padding:0 14px;gap:0;background:none;border-radius:0;box-shadow:none;z-index:5;pointer-events:none;transition:none}
#tabs.stuck{box-shadow:none}
#tabs.stuck #mbg{filter:drop-shadow(0 12px 16px rgba(60,50,140,.22))}
#mbg{position:absolute;left:0;top:0;width:100%;height:92px;overflow:visible;z-index:1;pointer-events:none}
#mpath{fill:var(--card);stroke:var(--line);stroke-width:1}
#glow{position:absolute;left:0;top:52px;width:160px;height:110px;background:radial-gradient(closest-side,rgba(139,77,255,.38),transparent);z-index:0;pointer-events:none;will-change:transform}
#bead{position:absolute;left:0;top:0;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#e0d8ff,var(--g1) 50%,var(--g2) 80%,var(--g3) 135%);display:grid;place-items:center;z-index:3;pointer-events:auto;touch-action:none;cursor:grab;box-shadow:0 8px 20px rgba(139,77,255,.55),inset 0 0 0 1px rgba(255,255,255,.35);will-change:transform}
#bead:not(.ready){opacity:0}
#bead:active{cursor:grabbing}
#bead svg{position:absolute;width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4) rotate(-40deg);transition:opacity .25s,transform .4s cubic-bezier(.3,1.4,.4,1)}
#bead svg.on{opacity:1;transform:none}
#tabs button{position:relative;z-index:2;flex:1;height:88px;padding:32px 0 0;margin:0;background:none;border:0;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mute);pointer-events:auto;overflow:visible;font:inherit}
#tabs button .ic{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:opacity .2s,transform .3s}
#tabs button.on{background:none;color:var(--g2)}
#tabs button.on .ic{opacity:0;transform:scale(.4)}
#tabs button .lb{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-size:11px;font-weight:700;color:var(--g2);opacity:0;transform:translateY(5px);transition:opacity .3s,transform .35s cubic-bezier(.3,1.4,.4,1)}
#tabs button.on .lb{opacity:1;transform:none}

function load() {

    $("main").innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
    ref.onSnapshot(s => {
      if (s.exists) state = Object.assign({ tr: [], dv: [], wl: [], px: {}, tg: {}, al: {}, hp: {} }, s.data());
      else {
        try {
          const l = JSON.parse(localStorage.getItem("bursa") || "null");
          if (l && l.tr && l.tr.length) { state = Object.assign(state, l); ref.set(state); }
        } catch (x) {}
      }
      setStatus("Sincronizat între telefon și PC");
      render();
    }, e => {
      try { state = Object.assign(state, JSON.parse(localStorage.getItem("bursa") || "{}")); } catch (x) {}
      setStatus("Eroare de sincronizare (" + (e && e.code ? e.code : "necunoscută") + "): datele se păstrează doar pe acest dispozitiv");
      render();
    });
  } else {
    try { state = Object.assign(state, JSON.parse(localStorage.getItem("bursa") || "{}")); } catch (e) {}
    setStatus("Firebase nu este configurat: datele rămân doar pe acest dispozitiv");
    render();
  }
}

  try { localStorage.setItem("bursa", JSON.stringify(state)); } catch (e) {}
  if (useFb) ref.set(state).catch(e => setStatus("Eroare la salvare în Firebase (" + (e && e.code ? e.code : "?") + ")"));
  render();
}

function positions() {
  const m = {};
  const list = [...state.tr].sort((a, b) => a.d.localeCompare(b.d));
  for (const x of list) {
    const p = m[x.s] || (m[x.s] = { s: x.s, q: 0, c: 0, r: 0 });
    if (x.t === "B") { p.c += x.q * x.p + x.f; p.q += x.q; }
    else {
      const avg = p.q ? p.c / p.q : 0;
      p.r += x.q * x.p - x.f - x.q * avg;
      p.c -= x.q * avg; p.q -= x.q;
    }
    if (Math.abs(p.q) < 1e-9) { p.q = 0; p.c = 0; }
  }

}

  const dur = calm ? 0 : Math.min(1000, 350 + Math.abs(v - from) / Math.max(Math.abs(v), 1) * 650);
  if (!dur || from === v) { shown = v; el.textContent = money(v) + " RON"; return; }

let bx = null, btarget = 0, braf = 0, bvel = 0, dragging = false;
function centers() { return [...document.querySelectorAll("#tabs button")].map(b => b.offsetLeft + b.offsetWidth / 2); }

  const bw = Math.min(36 + sp * 1.3, cx - R, W - R - cx), h = Math.max(5, h0 - sp * .24), a = cx - bw, b = cx + bw;

  $("tabs").appendChild(t); t.addEventListener("animationend", () => t.remove());

function confetti(x, y) {

  const W = c.width = innerWidth, H = c.height = innerHeight;
  document.body.appendChild(c);

    return { x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6, vr: (Math.random() - .5) * .4, w: 6 + Math.random() * 6, h: 3 + Math.random() * 5, c: cols[Math.random() * cols.length | 0] };
  });

      g.save(); g.translate(p.x, p.y); g.rotate(p.r);

document.addEventListener("pointerdown", e => {
  const b = e.target.closest("button"); if (!b || calm || b.closest("#tabs")) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2, n = document.createElement("span");

const hero = document.querySelector(".hero");
document.querySelector("header").addEventListener("pointermove", e => {

// ---- selecție comună: donut + scenă 3D ----

// ---- scena 3D ----
let sceneAng = 24, sceneDrag = null, sceneMoved = 0, sceneVisible = true;

function sceneHTML(rows) {

$("main").addEventListener("pointerdown", e => {

// ---- lumină care urmărește degetul pe sticlă ----

  const r = t.getBoundingClientRect();

// ---- notificări în aplicație + alerte de preț ----
let toastQ = [], toastBusy = false;
function toast(msg) { toastQ.push(msg); if (!toastBusy) nextToast(); }
function nextToast() {
  const m = toastQ.shift(); if (!m) { toastBusy = false; return; }
  toastBusy = true; const t = $("toast"); t.textContent = m; t.classList.add("on");
  setTimeout(() => { t.classList.remove("on"); setTimeout(nextToast, 450); }, 3800);
}
function checkAlerts() {
  let changed = false; const al = state.al || {};
  for (const s in al) {
    const a = al[s], px = parseFloat(state.px[s]); if (!(px > 0)) continue;
    const hi = a.hi > 0 && px >= a.hi, lo = a.lo > 0 && px <= a.lo, now = hi ? "hi" : lo ? "lo" : "";
    if (now && a.hit !== now) {
      a.hit = now; changed = true;
      toast(s + (hi ? " a urcat peste " + money(a.hi) : " a scăzut sub " + money(a.lo)) + " RON (acum " + money(px) + ")");
    } else if (!now && a.hit) { a.hit = ""; changed = true; }
  }
  return changed;

// ---- istoric de prețuri, grafic mic, schimbarea zilei ----
function pruneHp() { const k = Object.keys(state.hp || {}).sort(); while (k.length > 400) delete state.hp[k.shift()]; }

  for (const d in (state.hp || {})) { const v = state.hp[d][s]; if (v > 0) pts[d] = v; }
  const cur = parseFloat(state.px[s]); if (cur > 0) pts[iso()] = cur;
  return Object.keys(pts).sort().map(d => [new Date(d).getTime(), pts[d]]);
}
function spark(s) {
  const a = series(s); if (a.length < 2) return "";

  const X = t => t1 > t0 ? (t - t0) / (t1 - t0) * 100 : 50, Y = v => hi > lo ? 26 - (v - lo) / (hi - lo) * 22 : 14;
  const d = a.map((x, i) => (i ? "L" : "M") + X(x[0]).toFixed(1) + " " + Y(x[1]).toFixed(1)).join(" ");

    if (!prev) continue;

// ---- rezumat pentru agentul Finanțe ----
function summaryText() {
  const open = positions().filter(p => p.q > 0).sort((a, b) => b.c - a.c);
  const vals = open.map(p => { const px = parseFloat(state.px[p.s]); return px > 0 ? p.q * px : p.c; });
  const tot = vals.reduce((a, b) => a + b, 0), inv = open.reduce((a, p) => a + p.c, 0);
  const real = positions().reduce((a, p) => a + p.r, 0);
  const lines = open.map((p, i) => {
    const px = parseFloat(state.px[p.s]), has = px > 0, pl = has ? vals[i] - p.c : 0, tg = (state.tg || {})[p.s];
    return "- " + p.s + ": " + qty(p.q) + " acțiuni, preț mediu " + money(p.c / p.q) + ", " + (has ? "preț curent " + money(px) + ", " : "") +
      "valoare " + money(vals[i]) + " RON" + (has ? ", " + sign(pl) + " RON (" + (pl > 0 ? "+" : "") + money(pl / p.c * 100) + "%)" : "") +
      ", pondere " + money(vals[i] / tot * 100) + "%" + (tg ? ", țintă " + money(tg) + "%" : "");
  });
  return "Portofoliul meu la Tradeville, în RON, la data de " + iso() + ":\nValoare totală " + money(tot) + ", investit " + money(inv) +
    ", profit latent " + sign(tot - inv) + ", profit realizat " + sign(real) + ".\nPoziții:\n" + lines.join("\n") +
    "\n\nAnalizează structura portofoliului și spune-mi ce riscuri și dezechilibre vezi.";
}

  }

const PAL = ["#5b4bff", "#ff5fa2", "#00b8a3", "#ffb020", "#2f9bff", "#ff6a3d", "#6fcf3a", "#c04cf0", "#8a5a44", "#7a8ca5", "#d4c000", "#e0245e"];
function col(sym) {
  // culoarea rămâne a simbolului: se atribuie în ordinea primei cumpărări
  const order = [...new Set([...state.tr].sort((a, b) => a.d.localeCompare(b.d)).map(x => x.s))];
  const i = Math.max(0, order.indexOf(sym));
  return i < PAL.length ? PAL[i] : "hsl(" + Math.round((i * 137.5) % 360) + " 68% 50%)";
}
function txt(c) {
  const m = /^#([0-9a-f]{6})$/i.exec(c); if (!m) return "#fff";
  const v = [0, 2, 4].map(k => { const x = parseInt(m[1].slice(k, k + 2), 16) / 255; return x <= .03928 ? x / 12.92 : Math.pow((x + .055) / 1.055, 2.4); });
  return .2126 * v[0] + .7152 * v[1] + .0722 * v[2] > .35 ? "#1a1530" : "#fff";
}
function donut(open) {
  const rows = open.map(p => { const px = parseFloat(state.px[p.s]); return { s: p.s, v: px > 0 ? p.q * px : p.c }; })
    .sort((a, b) => b.v - a.v);
  const tot = rows.reduce((a, r) => a + r.v, 0);
  if (!(tot > 0)) return "";
  const C = 2 * Math.PI * 48, gap = rows.length > 1 ? 3 : 0;
  let cum = 0;
  const pc = r => (r.v / tot * 100).toLocaleString("ro-RO", { maximumFractionDigits: 1 });
  const arcs = rows.map((r, i) => {
    const len = r.v / tot * C;
    const a = `<circle class="arc" data-s="${esc(r.s)}" data-p="${pc(r)}" style="--C:${C.toFixed(1)};--i:${i}" cx="60" cy="60" r="48" fill="none" stroke="${col(r.s)}" stroke-width="16" stroke-dasharray="${Math.max(len - gap, 0.5)} ${C}" stroke-dashoffset="${-cum}" transform="rotate(-90 60 60)"/>`;
    cum += len; return a;
  }).join("");
  const leg = rows.map((r, i) => `<div class="lg" data-s="${esc(r.s)}" data-p="${pc(r)}" style="--i:${i}"><i class="dot" style="background:${col(r.s)}"></i><span>${esc(r.s)}</span><b>${money(r.v / tot * 100)}%</b></div>`).join("");
  return `<div class="alloc" data-n="${rows.length}"><svg viewBox="0 0 120 120" role="img" aria-label="Structura portofoliului">${arcs}<text x="60" y="60" text-anchor="middle" class="dn">${rows.length}</text><text x="60" y="75" text-anchor="middle" class="dl">poziții</text></svg><div class="legend">${leg}</div></div>`;
}

function viewPos(open, missing) {

  const vals = open.map(p => { const x = parseFloat(state.px[p.s]); return { s: p.s, v: x > 0 ? p.q * x : p.c }; }).sort((a, b) => b.v - a.v);

  let h = sceneHTML(vals) + donut(open) + open.map(p => {
    const avg = p.c / p.q, px = parseFloat(state.px[p.s]);

      </div>

      <input id="px-${esc(p.s)}" data-s="${esc(p.s)}" type="number" inputmode="decimal" step="any" value="${has ? px : ""}" placeholder="RON"></div>
      <details class="more" data-s="${esc(p.s)}" ${openDet.has(p.s) ? "open" : ""}><summary>Țintă și alerte${nset ? " (" + nset + ")" : ""}</summary>
        <div class="grid3">

          <div><label>Alertă sub</label><input type="number" inputmode="decimal" step="any" data-as="${esc(p.s)}" data-ak="lo" value="${al.lo || ""}" placeholder="RON"></div>

        </div></details></div>`;
  }).join("");
  if (missing) h += `<div class="sub" style="padding:4px 8px">Pentru ${missing} poziții fără preț curent, valoarea este egală cu suma investită.</div>`;

}

function draw(c) {

  const max = Math.max(1, ...(c.bars || []), ...c.lines.flatMap(l => l.v)) * 1.1;
  const X = i => L + (c.n > 1 ? i / (c.n - 1) * w : w / 2), Y = v => T + h - Math.max(0, v) / max * h;

    const v = max / 1.1 * k / 3;
    g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end" class="ax">${short(v)}</text>`;
  }
  const step = c.step || Math.max(1, Math.ceil(c.n / 6));
  for (let i = 0; i < c.n; i += step) g += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" class="ax">${esc(c.xl(i))}</text>`;
  const bw = Math.max(2, Math.min(14, w / c.n * .6));

  const lines = c.lines.map(l => {

    return area + `<path class="${l.dash ? "fadeln" : "ln"}" pathLength="1" d="${d}" fill="none" stroke="${l.c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"${l.dash ? ' stroke-dasharray="5 4"' : ""}/>`;
  }).join("");

function scrub(e) {

function evo() {
  const t = [...state.tr].sort((a, b) => a.d.localeCompare(b.d));
  if (!t.length) return null;
  const now = iso().slice(0, 7);
  let [y, m] = t[0].d.slice(0, 7).split("-").map(Number);
  const [ny, nm] = now.split("-").map(Number), months = [];
  while (y < ny || (y === ny && m <= nm)) { months.push(y + "-" + String(m).padStart(2, "0")); if (++m > 12) { m = 1; y++; } }
  const q = {}, last = {}, out = []; let net = 0, i = 0;
  for (const ym of months) {
    let contrib = 0;
    while (i < t.length && t[i].d.slice(0, 7) <= ym) {
      const x = t[i++], amt = x.t === "B" ? x.q * x.p + x.f : -(x.q * x.p - x.f);
      net += amt; contrib += amt; q[x.s] = (q[x.s] || 0) + (x.t === "B" ? x.q : -x.q); last[x.s] = x.p;
    }
    let val = 0;
    for (const s in q) if (q[s] > 1e-9) { const cur = parseFloat(state.px[s]); val += q[s] * (ym === now && cur > 0 ? cur : last[s]); }
    out.push({ ym, contrib, net, val });
  }
  return out;
}
function viewEv() {

function updateSim(interactive) {

  const alloc = rows.length && simP.m > 0 ? `<div class="card"><div class="sub" style="margin-bottom:8px">Cum ai împărți suma lunară, după ponderile de acum</div>` + rows.map(r =>
    `<div class="tr" style="grid-template-columns:14px 1fr auto"><i class="dot" style="background:${col(r.s)};margin:0"></i><div><b>${esc(r.s)}</b> <span class="sub">${money(r.w * 100)}%</span></div><div class="v">${money(r.amt)}<div class="sub">≈ ${r.sh.toLocaleString("ro-RO", { maximumFractionDigits: 2 })} acțiuni</div></div></div>`).join("") + `</div>` : "";
  $("simout").innerHTML = `<div class="stats">${tile("Total investit", put + v0)}${tile("Valoare estimată", base, "pos")}${tile("Câștig estimat", base - put - v0, cls(base - put - v0))}</div>

  if (interactive) $("main").classList.remove("anim");
}

    checkAlerts(); save(); const f = document.getElementById("px-" + s); if (f) f.classList.add("okf");
  } else if (t.dataset.ts) {
    const v = parseFloat(t.value); state.tg = state.tg || {};
    if (v > 0 && v < 100) state.tg[t.dataset.ts] = v; else delete state.tg[t.dataset.ts];
    save();
  } else if (t.dataset.as) {
    const v = parseFloat(t.value); state.al = state.al || {};
    const a = state.al[t.dataset.as] = state.al[t.dataset.as] || { lo: 0, hi: 0, hit: "" };
    a[t.dataset.ak] = v > 0 ? v : 0; a.hit = "";
    if (!(a.lo > 0) && !(a.hi > 0)) delete state.al[t.dataset.as];
    checkAlerts(); save();
  }
};

let pxInit = false, lastAdded = [];
function setLive(text, ok) { const b = $("live"); b.textContent = text; b.classList.toggle("off", !ok); }
async function refreshPrices() {
  if (!WORKER_URL) { setLive("Prețuri introduse manual · adaugă WORKER_URL pentru BVB", false); return 0; }
  const syms = [...new Set([...positions().filter(p => p.q > 0).map(p => p.s), ...state.wl.map(w => w.s)])];
  if (!syms.length) return 0;
  try {
    setLive("Se actualizează prețurile…", true);
    const r = await fetch(WORKER_URL.replace(/\/$/, "") + "/prices?s=" + syms.join(","));
    const j = await r.json();
    if (!j.prices) throw new Error("fără prețuri");
    let n = 0, ch = false;
    state.hp = state.hp || {}; const td = iso(), hs = state.hp[td] || (state.hp[td] = {});
    for (const s of syms) if (j.prices[s] > 0) {
      n++;
      if (state.px[s] !== j.prices[s]) { state.px[s] = j.prices[s]; ch = true; }
      if (hs[s] !== j.prices[s]) { hs[s] = j.prices[s]; ch = true; }
    }
    pruneHp();
    if (checkAlerts()) ch = true;
    if (ch) save();
    const hm = ((j.updated || "").split(" ")[1] || "").slice(0, 5);
    setLive("BVB · " + n + "/" + syms.length + " simboluri" + (hm ? " · " + hm : "") + " · atinge pentru reîmprospătare", n > 0);
    return n;
  } catch (e) { setLive("Nu am putut lua prețurile de la BVB · atinge ca să reîncerci", false); return 0; }
}

const norm = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const iso = (off = 0) => { const d = new Date(); d.setDate(d.getDate() + off); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const toNum = x => parseFloat(String(x).replace(",", "."));
const known = () => [...new Set(state.tr.map(x => x.s))];
function localParse(text) {
  const t = norm(text), actions = [];
  let d = iso();
  if (/\bieri\b/.test(t)) d = iso(-1);
  const m = t.match(/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);
  if (m) d = m[3] + "-" + m[2].padStart(2, "0") + "-" + m[1].padStart(2, "0");
  const re = /(cumpar\w*|vand\w*)\s+(\d+(?:[.,]\d+)?)\s+(?:actiuni\s+|unitati\s+)?([a-z][a-z0-9]{1,9})\s+(?:la|@|cu|pret)\s*(?:pretul\s*)?(\d+(?:[.,]\d+)?)/g;
  for (const x of t.matchAll(re)) actions.push({ type: x[1].startsWith("cump") ? "buy" : "sell", d, s: x[3].toUpperCase(), q: toNum(x[2]), p: toNum(x[4]) });
  if (/(actualiz|reimprosp|refresh|update)/.test(t) && /(pret|cotati|bvb|bursa)/.test(t)) actions.push({ type: "refresh" });
  return { actions, reply: actions.length ? "" : "Nu am înțeles. Încearcă: „am cumpărat 5 EVER la 3,45” sau „actualizează prețurile”." };
}
async function ask(text) {
  if (WORKER_URL) {
    let k = localStorage.getItem("bursaKey");
    if (k === null) { k = prompt("Cheia aplicației (APP_KEY din Worker). Lasă gol ca să folosești modul local.") || "-"; localStorage.setItem("bursaKey", k); }
    if (k !== "-") {
      try {
        const r = await fetch(WORKER_URL.replace(/\/$/, "") + "/agent", { method: "POST", headers: { "content-type": "application/json", "x-app-key": k }, body: JSON.stringify({ text, today: iso(), symbols: known() }) });
        if (r.status === 401) localStorage.removeItem("bursaKey");
        else { const j = await r.json(); if (Array.isArray(j.actions)) return j; }
      } catch (e) {}
    }
  }
  return localParse(text);
}
function say(text, who) { const b = document.createElement("div"); b.className = "b " + who; b.textContent = text; $("log").appendChild(b); $("log").scrollTop = 1e6; return b; }
function undoBtn() {
  const b = document.createElement("button"); b.className = "lnk"; b.textContent = "Anulează ultima adăugare";
  b.onclick = () => { lastAdded.forEach(([k, id]) => { state[k] = state[k].filter(x => x.id !== id); }); lastAdded = []; save(); b.remove(); say("Am anulat.", "ai"); };
  $("log").appendChild(b); $("log").scrollTop = 1e6;
}
async function runActions(j) {
  const msgs = [], added = []; let refresh = false;
  for (const a of j.actions || []) {
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6), s = String(a.s || "").toUpperCase();
    if (a.type === "buy" || a.type === "sell") {
      const q = +a.q, p = +a.p;
      if (!s || !(q > 0) || !(p > 0)) { msgs.push("Mi-au lipsit simbolul, cantitatea sau prețul pentru o tranzacție."); continue; }
      if (a.type === "sell") {
        const held = (positions().find(x => x.s === s) || { q: 0 }).q;
        if (q > held + 1e-9) { msgs.push("Ai doar " + qty(held) + " " + s + ", deci nu am înregistrat vânzarea de " + qty(q) + "."); continue; }
      }
      state.tr.push({ id, d: a.d || iso(), s, t: a.type === "buy" ? "B" : "V", q, p, f: +a.f || 0 });
      added.push(["tr", id]);
      msgs.push((a.type === "buy" ? "Cumpărat " : "Vândut ") + qty(q) + " " + s + " la " + money(p) + " RON (" + (a.d || iso()) + ")");
    } else if (a.type === "refresh") refresh = true;
  }
  if (j.reply) msgs.unshift(j.reply);
  if (msgs.length) say(msgs.join("\n"), "ai");
  if (added.length) { lastAdded = added; animateNext = true; save(); confetti(innerWidth / 2, innerHeight * .6); undoBtn(); refresh = true; }
  if (refresh) {
    const n = await refreshPrices();
    say(n ? "Prețuri actualizate de pe BVB (" + n + " simboluri)." : "Nu am putut actualiza prețurile de pe BVB.", "ai");
  }
}
async function send() {
  const t = $("msg").value.trim(); if (!t) return;
  $("msg").value = ""; say(t, "me");
  const th = say("", "ai"); th.classList.add("typing"); th.innerHTML = "<i></i><i></i><i></i>";
  const j = await ask(t);
  th.remove(); await runActions(j);
}
